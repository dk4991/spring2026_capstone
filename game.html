<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生命轨迹：步履不停 Life Trajectory</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #f5eedf; font-family: "PingFang SC", "STHeiti", "Segoe UI", sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; color: #5a4a3a; width: 220px; }
        .stat { font-size: 14px; margin-bottom: 8px; background: rgba(0,0,0,0.05); padding: 8px 12px; border-left: 3px solid #8b572a; transition: opacity 0.5s; }
        
        #timer-container { margin-top: 10px; border-left-color: #d0021b; }
        #timer-bar-bg { width: 100%; height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px; overflow: hidden; margin-top: 5px; }
        #timer-bar-fill { width: 100%; height: 100%; background: #d0021b; transition: width 0.03s linear; }
        .timer-text { font-weight: bold; color: #d0021b; font-variant-numeric: tabular-nums; }

        #controls { position: absolute; top: 20px; right: 20px; z-index: 110; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; background: #8b572a; color: #fff; border: none; cursor: pointer; border-radius: 25px; font-size: 14px; pointer-events: auto; transition: opacity 0.3s; }
        .btn:hover { opacity: 0.9; }
        #lang-btn { background: #5a4a3a; }

        #gameCanvas { display: block; cursor: crosshair; }
        #overlay { position: fixed; bottom: 30px; right: 30px; width: 400px; max-height: 85%; background: rgba(255, 253, 247, 0.98); border: 1px solid #d2b48c; z-index: 100; color: #4a3e2e; display: flex; flex-direction: column; padding: 25px; border-radius: 15px; box-shadow: 0 15px 45px rgba(0,0,0,0.1); transition: all 0.6s; }
        .hidden { display: none !important; }
        .minimized { width: 160px !important; height: 50px !important; overflow: hidden; padding: 10px !important; opacity: 0.8; }
        
        /* Overlay styles */
        #instruction-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); z-index: 200; display: flex; justify-content: center; align-items: center; }
        .instruction-content { background: #fffbf0; border-radius: 15px; padding: 40px; max-width: 500px; color: #4a3e2e; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #dcd3b6; }
        .instruction-content h2 { color: #8b572a; margin-bottom: 20px; font-weight: 400; font-size: 24px; text-align: center; }
        .instruction-content p, .instruction-content li { margin-bottom: 12px; font-size: 15px; line-height: 1.6; }
        .instruction-content ul { padding-left: 20px; margin-bottom: 20px; }
        #start-game-btn { display: block; width: 100%; margin-top: 25px; font-size: 16px; padding: 15px; border-radius: 30px; }
        .scroll-container { flex-grow: 1; overflow-y: auto; padding-right: 10px; }
        .event-item { padding: 20px 0; border-bottom: 1px dashed #e6dec9; font-size: 13.5px; line-height: 1.8; }
        .age-tag { color: #8b572a; font-weight: bold; margin-right: 12px; }
        .toggle-view { cursor: pointer; color: #8b572a; font-size: 12px; font-weight: bold; text-align: right; text-decoration: underline; margin-bottom: 10px; pointer-events: auto; }
        h2 { font-weight: 300; letter-spacing: 2px; color: #333; margin-top: 0; text-align: center; font-size: 20px; }
    </style>
</head>
<body>

    <div id="controls">
        <button class="btn" id="back-btn" onclick="window.close(); if(!window.closed) location.href='index.html';">&#8592; Back</button>
        <button id="restart-btn" class="btn" onclick="location.reload()">再历因缘 / Revisit</button>
    </div>

    <div id="ui">
        <div class="stat"><span id="label-age">岁数</span>: <span id="timer">0</span></div>
        <div class="stat"><span id="label-mind">心境</span>: <span id="score">0</span></div>
        <div class="stat" id="timer-container">
            <span id="label-wait">人生如电</span>: <span id="countdown-text" class="timer-text">5.0</span>s
            <div id="timer-bar-bg"><div id="timer-bar-fill"></div></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay" class="hidden">
        <div class="toggle-view" id="toggle-text" onclick="document.getElementById('overlay').classList.toggle('minimized')">[ 观察轨迹 / 生命纪实 ]</div>
        <div class="scroll-container">
            <h2 id="death-title">大限已至，因缘归位</h2>
            <div id="chronicle-list" class="chronicle"></div>
        </div>
    </div>

    <!-- Instruction Overlay -->
    <div id="instruction-overlay">
        <div class="instruction-content">
            <h2 id="inst-title">Rules</h2>
            <div id="inst-text"></div>
            <button id="start-game-btn" class="btn">Start Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const countdownText = document.getElementById('countdown-text');
        const timerBarFill = document.getElementById('timer-bar-fill');
        const overlay = document.getElementById('overlay');
        const chronicleList = document.getElementById('chronicle-list');

        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || 'en'; 
        
        const i18n = {
            zh: {
                age: "岁数", mind: "心境", restart: "再历因缘", wait: "人生如电", back: "← 返回",
                toggle: "[ 观察轨迹 / 生命纪实 ]", death: "大限已至，因缘归位",
                unit: "岁", defaultEvent: "这一岁，你平静地度过，在平淡的琐碎中体味着岁月的流金。",
                deathDesc: (age) => `在 ${age} 岁这一年，你感觉到体内的那股气劲慢慢散去。朱砂色的线条早已将所有破碎的瞬间连接。你安详地闭上眼。`,
                instTitle: "生命轨迹：规则",
                instText: `
                    <p>1. <b>点击</b>相邻的网格点（避开黑色障碍）落下白子并推进你的生命轨迹。</p>
                    <p>2. 时光流逝：每个回合有<b>5秒倒计时</b>。若不操作，命运将替你抉择。</p>
                    <p>3. 在棋盘上游走，你将会遭遇不同的命运节点：</p>
                    <ul>
                        <li><span style="color:#2a8b2a; font-weight:bold;">● (绿色圈)</span>: 顺境与好机遇 (+)。</li>
                        <li><span style="color:#8b2a2a; font-weight:bold;">▲ (深红色)</span>: 逆境与差机遇 (-)。</li>
                        <li><span style="color:#8b572a; font-weight:bold;">■ (棕色框)</span>: 未知的盲盒 (?)。</li>
                    </ul>
                    <p>4. <b>十年大运</b>: 每过十年，运势轮转，棋盘上的障碍将随之重组。</p>
                `,
                instBtn: "我明白了，开始体验"
            },
            en: {
                age: "Age", mind: "Mindset", restart: "Revisit Fate", wait: "Life is Short", back: "← Back",
                toggle: "[ Observe Path / Life Chronicles ]", death: "The End has Arrived; Karma Returns",
                unit: "Age", defaultEvent: "This year passes quietly, savoring the flow of time.",
                deathDesc: (age) => `At age ${age}, you feel the energy dissipate. The cinnabar line has connected every moment. You close your eyes.`,
                instTitle: "Life Trajectory: Rules",
                instText: `
                    <p>1. <b>Click</b> on any adjacent grid point (excluding black obstacles) to place a white piece and advance your life trajectory.</p>
                    <p>2. Time is clicking: a <b>5-second timer</b> forces your hand. If you do not move, fate will choose for you.</p>
                    <p>3. As you navigate the board, you will encounter different nodes of fate:</p>
                    <ul>
                        <li><span style="color:#2a8b2a; font-weight:bold;">● (Green Circle)</span>: A good opportunity (+).</li>
                        <li><span style="color:#8b2a2a; font-weight:bold;">▲ (Dark Red)</span>: A difficult event (-).</li>
                        <li><span style="color:#8b572a; font-weight:bold;">■ (Brown Box)</span>: An unknown mystery (?).</li>
                    </ul>
                    <p>4. <b>10-Year Cycle</b>: Every ten years, your luck cycle changes, reshaping the labyrinth of black obstacles.</p>
                `,
                instBtn: "I Understand, Start Game"
            }
        };

        const eventPool = {
            zh: {
                infant: ["摇晃着迈出第一步，世界瞬间辽阔", "在泥地里发现了一只受伤的麻雀，心生悲悯", "把掉落的牙齿扔向房顶，期待长大", "深夜听见父母讨论柴米油盐，察觉生活的重力"],
                teen: ["校赛进球纵情欢呼，这是最纯粹的骄傲", "灯下写了封未寄出的信，藏着夏天的风", "大雪后与好友在车站分别，领略惆怅", "熬夜读完一本改变观点的书，星火凝聚"],
                young: ["拿到第一笔微薄薪水，奖励自己一份晚餐", "独自去了一座陌生的城市，确认孤独的自由", "通宵努力赢得了职场认可，心境自此不同", "简朴仪式上与挚爱交换戒指，生命有了归宿", "看着新生命降临，彻底理解了责任"],
                middle: ["签下房产合同，在城市有了坐标", "带父母远方旅行，心中满是温情", "重拾搁置的爱好，开辟一方静谧", "看着孩子独立步入社会，使命圆满"],
                senior: ["看落叶精准坠地，体悟顺其自然", "整理旧物翻出多年前戏票，字迹已散", "在摇椅上与起伏相对，归于平静", "重拾笔墨，流淌沉淀一生的宁静"],
                tragedy: ["遭遇沉重背叛，审视人性边界", "突如其来的变故，在废墟中学会坚韧", "一场大病卧床数月，看清万物序位"]
            },
            en: {
                infant: ["Took first steps; the world became vast.", "Found an injured sparrow; felt compassion.", "Threw a tooth on the roof; longed for growth.", "Heard parents whispering about bills; felt life's weight."],
                teen: ["Cheered for a winning goal; pure pride.", "Wrote an unsent letter; stored the summer wind.", "Parted at a station; tasted melancholy.", "Read a life-changing book; sparks coalesced."],
                young: ["First paycheck; a modest dinner reward.", "Solo trip to a new city; lonely freedom.", "First professional win; a new mindset.", "Exchanged rings; life found a home.", "New life arrived; duty understood."],
                middle: ["Signed a property deed; found your spot.", "Traveled with parents; heart felt warm.", "Reclaimed a hobby; found inner peace.", "Child became independent; mission complete."],
                senior: ["Watched leaves fall; accepted nature.", "Found an old ticket; faded but clear.", "Rocking chair reflection; waves calmed.", "Flowing brush; lifelong serenity."],
                tragedy: ["Faced betrayal; re-examined humanity.", "Sudden crisis; learned resilience in ruins.", "Major illness; clarified priorities."]
            }
        };

        const gridSize = 60;
        let age = 0; let score = 0;
        let maxAge = 75 + Math.floor(Math.random() * 15); 
        let pieces = []; let activeDrop = null; 
        let history = []; let isEnded = false;
        let fateCenter = { x: 0, y: 0 };
        let lineProgress = 0; let lineAlpha = 0.6; let alphaDir = -0.01;
        const lifeState = { tragedyCount: 0 };
        const usedEventsIndices = new Set();

        const AUTO_LIMIT = 5000; 
        let lastActionTime = Date.now();

        let gameStarted = false;

        function updateUI() {
            const lang = i18n[currentLang];
            document.getElementById('label-age').innerText = lang.age;
            document.getElementById('label-mind').innerText = lang.mind;
            document.getElementById('label-wait').innerText = lang.wait;
            document.getElementById('restart-btn').innerText = lang.restart;
            document.getElementById('back-btn').innerText = lang.back;
            document.getElementById('toggle-text').innerText = lang.toggle;
            document.getElementById('death-title').innerText = lang.death;
            document.getElementById('inst-title').innerText = lang.instTitle;
            document.getElementById('inst-text').innerHTML = lang.instText;
            document.getElementById('start-game-btn').innerText = lang.instBtn;
            if (isEnded || history.length > 0) renderChronicle();
        }

        function getLifeNarrative(age) {
            let category = "";
            let isTragedy = false;
            if (lifeState.tragedyCount < 2 && Math.random() < 0.1) {
                category = "tragedy";
                isTragedy = true;
            } else {
                if (age <= 12) category = "infant";
                else if (age <= 18) category = "teen";
                else if (age <= 35) category = "young";
                else if (age <= 55) category = "middle";
                else category = "senior";
            }
            const poolZh = eventPool.zh[category];
            const availableIndices = poolZh.map((_, i) => i).filter(i => !usedEventsIndices.has(category + i));
            if (availableIndices.length === 0) return { zh: i18n.zh.defaultEvent, en: i18n.en.defaultEvent };
            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            usedEventsIndices.add(category + randomIndex);
            if(isTragedy) lifeState.tragedyCount++;
            return { zh: eventPool.zh[category][randomIndex], en: eventPool.en[category][randomIndex] };
        }

        function renderChronicle() {
            chronicleList.innerHTML = history.map(ev => {
                const desc = ev.isDeath ? i18n[currentLang].deathDesc(ev.age) : ev.desc[currentLang];
                return `<div class="event-item"><span class="age-tag">${ev.age} ${i18n[currentLang].unit}</span>${desc}</div>`;
            }).join('');
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        function init() {
            resize();
            updateUI();
            
            document.getElementById('start-game-btn').addEventListener('click', () => {
                document.getElementById('instruction-overlay').classList.add('hidden');
                gameStarted = true;
                lastActionTime = Date.now();
            });

            generateObstacles();
            generateOrbs();
            const startX = Math.round((canvas.width/2)/gridSize)*gridSize;
            const startY = Math.round((canvas.height/2)/gridSize)*gridSize;
            pieces = pieces.filter(p => !(p.x === startX && p.y === startY));
            activeDrop = { x: startX, y: startY, visualY: startY, state: 'floating' };
            lastActionTime = Date.now();
            draw();
        }
        
        function generateObstacles() {
            pieces = pieces.filter(p => p.type !== 'black');
            fateCenter = { x: Math.random()*canvas.width, y: Math.random()*canvas.height };
            for(let i=0; i<100; i++) {
                const a = i * 0.45; const d = i * 15;
                const x = Math.round((fateCenter.x + Math.cos(a)*d)/gridSize)*gridSize;
                const y = Math.round((fateCenter.y + Math.sin(a)*d)/gridSize)*gridSize;
                if(!pieces.find(p => p.x === x && p.y === y)) pieces.push({x, y, type:'black'});
            }
        }

        function generateOrbs() {
            pieces = pieces.filter(p => !['mystery', 'good', 'bad'].includes(p.type));
            for(let i=0; i<18; i++) {
                const x = Math.floor(Math.random() * (canvas.width/gridSize)) * gridSize;
                const y = Math.floor(Math.random() * (canvas.height/gridSize)) * gridSize;
                if (!pieces.find(p => p.x === x && p.y === y)) {
                    let type = 'mystery';
                    const rand = Math.random();
                    if (rand < 0.3) type = 'good';
                    else if (rand < 0.6) type = 'bad';
                    pieces.push({ x, y, type });
                }
            }
        }

        function executeMove(tx, ty) {
            if (isEnded) return;
            const target = pieces.find(p => p.x === tx && p.y === ty);

            // 只有当目标不是白色棋子时，才将旧位置转为白色并增加年龄（即生命前进）
            if (!target || target.type !== 'white') {
                pieces.push({ x: activeDrop.x, y: activeDrop.y, type: 'white', order: age });
                if (target && ['mystery', 'good', 'bad'].includes(target.type)) {
                    pieces = pieces.filter(p => p !== target);
                    if (target.type === 'good') score += 2;
                    else if (target.type === 'bad') score -= 2;
                    else score += (Math.random() > 0.4 ? 2 : -2); // mystery
                    history.push({ age: age, desc: getLifeNarrative(age), isDeath: false });
                }
                age++;
                timerEl.innerText = age;
                scoreEl.innerText = score;
            }

            // 更新活跃位置（无论是否是白子，水滴都要移过去）
            activeDrop = { x: tx, y: ty, visualY: ty - 100, state: 'falling' };
            lastActionTime = Date.now();

            if (age % 10 === 0 && age > 0 && (!target || target.type !== 'white')) {
                generateObstacles();
                generateOrbs();
            }
            if (age >= maxAge) finishGame();
        }

        function forceAutoDrive() {
            const dirs = [{x:activeDrop.x+gridSize, y:activeDrop.y},{x:activeDrop.x-gridSize, y:activeDrop.y},{x:activeDrop.x, y:activeDrop.y+gridSize},{x:activeDrop.x, y:activeDrop.y-gridSize}];
            const validDirs = dirs.filter(d => {
                const p = pieces.find(p => p.x === d.x && p.y === d.y);
                return (!p || p.type !== 'black') && d.x >= 0 && d.x <= canvas.width && d.y >= 0 && d.y <= canvas.height;
            });
            const finalMove = validDirs.length > 0 ? validDirs[Math.floor(Math.random()*validDirs.length)] : dirs[0];
            executeMove(finalMove.x, finalMove.y);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isEnded) return;
            const rect = canvas.getBoundingClientRect();
            const tx = Math.round((e.clientX - rect.left)/gridSize)*gridSize;
            const ty = Math.round((e.clientY - rect.top)/gridSize)*gridSize;
            
            const target = pieces.find(p => p.x === tx && p.y === ty);
            const dx = Math.abs(tx - activeDrop.x);
            const dy = Math.abs(ty - activeDrop.y);

            // 判定逻辑：
            // 1. 距离必须在一格之内。
            // 2. 不能是黑色棋子。
            // 3. 不能点击当前位置本身。
            if (dx > gridSize || dy > gridSize || (dx === 0 && dy === 0)) return;
            if (target && target.type === 'black') return;

            // 如果点击的是白子，executeMove 会处理成“瞬间移动”而不增加年龄
            executeMove(tx, ty);
        });

        function finishGame() {
            isEnded = true;
            history.push({ age: age, isDeath: true });
            overlay.classList.remove('hidden');
            renderChronicle();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(139, 91, 42, 0.05)";
            for(let i=0; i<canvas.width; i+=gridSize){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=gridSize){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            const whites = pieces.filter(p => p.type === 'white').sort((a,b) => a.order - b.order);
            if (whites.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = `rgba(139, 42, 42, ${lineAlpha})`; ctx.lineWidth = 4;
                ctx.moveTo(whites[0].x, whites[0].y);
                const limit = isEnded ? Math.floor(lineProgress * (whites.length - 1)) : whites.length - 1;
                for(let i=1; i<=limit; i++) ctx.lineTo(whites[i].x, whites[i].y);
                ctx.stroke();
                if(isEnded) {
                    if(lineProgress < 1) lineProgress += 0.015;
                    lineAlpha += alphaDir; if(lineAlpha < 0.2 || lineAlpha > 0.8) alphaDir *= -1;
                }
            }

            pieces.forEach(p => {
                ctx.beginPath(); 
                if (p.type === 'white') { ctx.arc(p.x, p.y, 14, 0, Math.PI*2); ctx.fillStyle = "#fff"; ctx.shadowBlur = 8; ctx.shadowColor = "#fff"; ctx.fill(); }
                else if (p.type === 'black') { ctx.arc(p.x, p.y, 14, 0, Math.PI*2); ctx.fillStyle = "#2c2825"; ctx.fill(); }
                else if (p.type === 'mystery') { 
                    ctx.strokeStyle = "#8b572a"; ctx.lineWidth = 1.5; ctx.strokeRect(p.x-10, p.y-10, 20, 20); 
                    ctx.fillStyle = "#8b572a"; ctx.font = "bold 14px sans-serif"; ctx.fillText("?", p.x-4, p.y+5);
                }
                else if (p.type === 'good') { 
                    ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.strokeStyle = "#2a8b2a"; ctx.lineWidth = 2; ctx.stroke(); 
                    ctx.fillStyle = "#2a8b2a"; ctx.font = "bold 16px sans-serif"; ctx.fillText("+", p.x-5, p.y+5);
                    ctx.shadowBlur = 4; ctx.shadowColor = "#2a8b2a";
                }
                else if (p.type === 'bad') { 
                    ctx.moveTo(p.x, p.y - 14); ctx.lineTo(p.x + 12, p.y + 10); ctx.lineTo(p.x - 12, p.y + 10); ctx.closePath();
                    ctx.fillStyle = "#8b2a2a"; ctx.fill(); 
                    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.fillText("-", p.x-3, p.y+4);
                    ctx.shadowBlur = 4; ctx.shadowColor = "#8b2a2a";
                }
                ctx.shadowBlur = 0;
            });

            if (activeDrop && !isEnded && gameStarted) {
                const elapsed = Date.now() - lastActionTime;
                const timeLeft = Math.max(0, (AUTO_LIMIT - elapsed) / 1000);
                
                countdownText.innerText = timeLeft.toFixed(1);
                timerBarFill.style.width = (timeLeft / (AUTO_LIMIT/1000) * 100) + "%";
                
                const isCritical = timeLeft < 1.5;
                const activeColor = isCritical ? "#d0021b" : "#00b4d8";
                
                countdownText.style.color = isCritical ? "#d0021b" : "#5a4a3a";
                timerBarFill.style.background = isCritical ? "#d0021b" : "#d0021b";

                if (elapsed >= AUTO_LIMIT) forceAutoDrive();
                if (activeDrop.state === 'falling' && activeDrop.visualY < activeDrop.y) activeDrop.visualY += 12;
                
                const timeLeftRatio = timeLeft / (AUTO_LIMIT/1000);
                ctx.beginPath();
                ctx.arc(activeDrop.x, activeDrop.visualY, 24, -Math.PI/2, (-Math.PI/2) + (Math.PI*2 * timeLeftRatio));
                ctx.strokeStyle = isCritical ? "rgba(208, 2, 27, 0.8)" : "rgba(255, 255, 255, 0.6)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath(); ctx.arc(activeDrop.x, activeDrop.visualY, 18, 0, Math.PI*2);
                ctx.fillStyle = activeColor; ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { resize(); });
        init();
    </script>
</body>
</html>
