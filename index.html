<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生命轨迹 Life Trajectory</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #f5eedf; font-family: "PingFang SC", "STHeiti", "Segoe UI", sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; color: #5a4a3a; }
        .stat { font-size: 14px; margin-bottom: 8px; background: rgba(0,0,0,0.05); padding: 8px 12px; border-left: 3px solid #8b572a; }
        
        /* 按钮容器 */
        #controls { position: absolute; top: 20px; right: 20px; z-index: 110; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; background: #8b572a; color: #fff; border: none; cursor: pointer; border-radius: 25px; font-size: 14px; pointer-events: auto; transition: opacity 0.3s; }
        .btn:hover { opacity: 0.9; }
        #lang-btn { background: #5a4a3a; }

        #gameCanvas { display: block; cursor: crosshair; }
        #overlay { position: fixed; bottom: 30px; right: 30px; width: 400px; max-height: 85%; background: rgba(255, 253, 247, 0.98); border: 1px solid #d2b48c; z-index: 100; color: #4a3e2e; display: flex; flex-direction: column; padding: 25px; border-radius: 15px; box-shadow: 0 15px 45px rgba(0,0,0,0.1); transition: all 0.6s; }
        .hidden { display: none !important; }
        .minimized { width: 160px !important; height: 50px !important; overflow: hidden; padding: 10px !important; opacity: 0.8; }
        .scroll-container { flex-grow: 1; overflow-y: auto; padding-right: 10px; }
        .event-item { padding: 20px 0; border-bottom: 1px dashed #e6dec9; font-size: 13.5px; line-height: 1.8; }
        .age-tag { color: #8b572a; font-weight: bold; margin-right: 12px; }
        .toggle-view { cursor: pointer; color: #8b572a; font-size: 12px; font-weight: bold; text-align: right; text-decoration: underline; margin-bottom: 10px; pointer-events: auto; }
        h2 { font-weight: 300; letter-spacing: 2px; color: #333; margin-top: 0; text-align: center; font-size: 20px; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="lang-btn" class="btn" onclick="toggleLanguage()">EN / 中文</button>
        <button id="restart-btn" class="btn" onclick="location.reload()">再历因缘 / Revisit</button>
    </div>

    <div id="ui">
        <div class="stat"><span id="label-age">岁数</span>: <span id="timer">0</span></div>
        <div class="stat"><span id="label-mind">心境</span>: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay" class="hidden">
        <div class="toggle-view" id="toggle-text" onclick="document.getElementById('overlay').classList.toggle('minimized')">[ 观察轨迹 / 生命纪实 ]</div>
        <div class="scroll-container">
            <h2 id="death-title">大限已至，因缘归位</h2>
            <div id="chronicle-list" class="chronicle"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const chronicleList = document.getElementById('chronicle-list');

        // 多语言配置
        let currentLang = 'zh'; 
        const i18n = {
            zh: {
                age: "岁数", mind: "心境", restart: "再历因缘", 
                toggle: "[ 观察轨迹 / 生命纪实 ]", death: "大限已至，因缘归位",
                unit: "岁", defaultEvent: "这一岁，你平静地度过，在平淡的琐碎中体味着岁月的流金。",
                deathDesc: (age) => `在 ${age} 岁这一年，你感觉到体内的那股气劲慢慢散去。你并不感到恐惧，只是静静凝视着这张由白、黑、红棋子交织而成的棋盘。你发现，那条朱砂色的线条早已将所有破碎的瞬间连接成了一幅宏大的作品。你安详地闭上眼，完成了对虚无的最后一次回应。`
            },
            en: {
                age: "Age", mind: "Mindset", restart: "Revisit Fate",
                toggle: "[ Observe Path / Life Chronicles ]", death: "The End has Arrived; Karma Returns",
                unit: "Age", defaultEvent: "This year passes quietly, as you savor the golden flow of time in the mundane details.",
                deathDesc: (age) => `At the age of ${age}, you feel the energy within you slowly dissipate. You feel no fear, only quietly gazing at this board woven with white, black, and red stones. You realize the cinnabar line has long since connected every broken moment into a grand masterpiece. You peacefully close your eyes, completing your final response to the void.`
            }
        };

        const eventPool = {
            zh: {
                infant: ["你在长辈的搀扶下摇晃着迈出第一步，世界在你眼中瞬间变得辽阔", "你在老屋后的泥地里发现了一只受伤的麻雀，第一次对‘弱小’生出悲悯", "你换牙那天把牙齿郑重地扔向房顶，满心期待着长大的模样", "你第一次在深夜听见父母低声讨论柴米油盐，隐约察觉到生活的重力"],
                teen: ["你站在操场中央，为校赛的进球纵情欢呼，那是青春里最纯粹的骄傲", "你在昏黄的灯下给邻桌写了一封未寄出的信，纸页里藏着夏天的风", "你在一场大雪后与好友在车站分别，第一次领略到‘远方’带来的惆怅", "你熬夜读完了一本改变人生观的书，内心原本散乱的星火开始凝聚"],
                young: ["你拿到了第一笔微薄的薪水，在陌生的街头买了一份并不算丰盛的晚餐奖励自己", "你独自背着包去了一座从未去过的城市，在午夜的车站确认了自由的孤独", "你通过无数个通宵的努力赢得了职场上的第一次认可，心境自此不同", "你在一场简朴而温馨的仪式上与挚爱交换了戒指，从此生命有了归宿", "你看着新生命的降临，那种血脉连接的震颤让你彻底理解了责任二字"],
                middle: ["你经过多年积攒签下了房产合同，终于在钢铁森林里拥有了属于自己的坐标", "你带着父母去了一趟远方旅行，看着他们因惊喜而局促的神情，你心中满是温情", "你重拾了年轻时搁置的爱好，在喧嚣的岁月里为自己开辟了一方静谧的田地", "你看着孩子独立步入社会，那种作为‘引路人’的使命感终于在此刻圆满"],
                senior: ["你开始习惯在公园的长椅上看落叶精准地坠地，体悟顺其自然的静美", "你整理旧物时翻出了多年前的戏票，字迹已随岁月散去，你只记得那天的风很轻", "你在黄昏的摇椅上与一生的起伏相对，发现那些曾经的波澜早已化作通透的平静", "你在晚年重拾笔墨，笔触间流淌的是沉淀了一生的宁静与豁达"],
                tragedy: ["你遭遇了一次沉重的职场背叛，这种寒意让你重新审视人性的边界", "你经历了一场突如其来的财务变故，虽然元气大伤，但也在废墟中学会了坚韧", "一场大病让你卧床数月，这种与死神的擦肩，让你看清了万物的序位"]
            },
            en: {
                infant: ["Supported by elders, you take your first wobbly steps; the world suddenly becomes vast.", "You find an injured sparrow in the mud, feeling compassion for the 'weak' for the first time.", "On the day you lose your first tooth, you throw it onto the roof, full of anticipation.", "Late at night, you overhear your parents whispering about bills, sensing the gravity of life."],
                teen: ["Standing on the field, you cheer for a winning goal; the purest pride of youth.", "Under a dim light, you write an unsent letter; the pages hold the summer breeze.", "After a heavy snow, you part with a friend at the station, tasting the melancholy of 'distance'.", "You stay up all night reading a book that changes your worldview; sparks begin to coalesce."],
                young: ["Receiving your first meager paycheck, you treat yourself to a modest dinner.", "Backpacking alone to an unfamiliar city, you confirm the lonely freedom of a midnight station.", "Through countless all-nighters, you win your first professional recognition.", "In a warm ceremony, you exchange rings with your soulmate; life finally has a home.", "Watching a new life arrive, you fully understand the word 'responsibility'."],
                middle: ["After years of saving, you sign a property contract, owning your coordinates in the concrete forest.", "You take your parents on a trip; seeing their faces, your heart fills with tenderness.", "You reclaim a hobby set aside in your youth, carving out a quiet field for yourself.", "Watching your child enter society independently, your duty as a 'guide' reaches completion."],
                senior: ["You watch fallen leaves hit the ground, realizing the quiet beauty of letting go.", "Sorting old things, you find a movie ticket; the ink has faded, but the memory is clear.", "In a twilight rocking chair, you find the waves have turned into transparent peace.", "In your later years, you pick up the brush again, flowing with settled serenity."],
                tragedy: ["You encounter a heavy betrayal in your career; the chill makes you re-examine humanity.", "You experience a sudden financial crisis; you learn resilience among the ruins.", "A major illness leaves you bedridden; this brush with death clarifies the true order of things."]
            }
        };

        const gridSize = 60;
        let age = 0; let score = 0;
        let maxAge = 82 + Math.floor(Math.random() * 6); 
        let pieces = []; let activeDrop = null; 
        let history = []; let isEnded = false;
        let fateCenter = { x: 0, y: 0 };
        let lineProgress = 0; let lineAlpha = 0.6; let alphaDir = -0.01;
        const lifeState = { tragedyCount: 0 };
        const usedEventsIndices = new Set(); // 存储索引以保持双语对应

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        function updateUI() {
            const lang = i18n[currentLang];
            document.getElementById('label-age').innerText = lang.age;
            document.getElementById('label-mind').innerText = lang.mind;
            document.getElementById('restart-btn').innerText = currentLang === 'zh' ? '再历因缘' : 'Revisit Fate';
            document.getElementById('toggle-text').innerText = lang.toggle;
            document.getElementById('death-title').innerText = lang.death;
            
            if (isEnded || history.length > 0) {
                renderChronicle();
            }
        }

        function getLifeNarrative(age) {
            let category = "";
            let isTragedy = false;
            if (lifeState.tragedyCount < 1 && Math.random() < 0.1) {
                category = "tragedy";
                isTragedy = true;
            } else {
                if (age <= 12) category = "infant";
                else if (age <= 18) category = "teen";
                else if (age <= 35) category = "young";
                else if (age <= 55) category = "middle";
                else category = "senior";
            }

            const poolZh = eventPool.zh[category];
            // 找出还没用过的索引
            const availableIndices = poolZh.map((_, i) => i).filter(i => !usedEventsIndices.has(category + i));
            
            if (availableIndices.length === 0) return { zh: i18n.zh.defaultEvent, en: i18n.en.defaultEvent };

            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            usedEventsIndices.add(category + randomIndex);
            if(isTragedy) lifeState.tragedyCount++;

            return {
                zh: eventPool.zh[category][randomIndex],
                en: eventPool.en[category][randomIndex]
            };
        }

        function renderChronicle() {
            chronicleList.innerHTML = history.map(ev => {
                const desc = ev.isDeath ? i18n[currentLang].deathDesc(ev.age) : ev.desc[currentLang];
                return `<div class="event-item"><span class="age-tag">${ev.age} ${i18n[currentLang].unit}</span>${desc}</div>`;
            }).join('');
        }

        // --- 核心逻辑部分 ---

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        function init() {
            resize();
            updateUI();
            fateCenter = { x: canvas.width / 2, y: canvas.height / 2 };
            for(let i=0; i<100; i++) {
                const a = i * 0.45; const d = i * 15;
                const x = Math.round((fateCenter.x + Math.cos(a)*d)/gridSize)*gridSize;
                const y = Math.round((fateCenter.y + Math.sin(a)*d)/gridSize)*gridSize;
                if(!pieces.find(p => p.x === x && p.y === y)) pieces.push({x, y, type:'black'});
            }
            generateOrbs();
            const startX = Math.round((canvas.width/2)/gridSize)*gridSize;
            const startY = Math.round((canvas.height/2)/gridSize)*gridSize;
            pieces = pieces.filter(p => !(p.x === startX && p.y === startY));
            activeDrop = { x: startX, y: startY, visualY: startY, state: 'floating' };
            draw();
        }

        function generateOrbs() {
            pieces = pieces.filter(p => p.type === 'black' || p.type === 'white');
            for(let i=0; i<10; i++) {
                const x = Math.floor(Math.random() * (canvas.width/gridSize)) * gridSize;
                const y = Math.floor(Math.random() * (canvas.height/gridSize)) * gridSize;
                if (!pieces.find(p => p.x === x && p.y === y)) pieces.push({ x, y, type: 'mystery' });
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isEnded) return;
            const rect = canvas.getBoundingClientRect();
            const tx = Math.round((e.clientX - rect.left)/gridSize)*gridSize;
            const ty = Math.round((e.clientY - rect.top)/gridSize)*gridSize;
            const target = pieces.find(p => p.x === tx && p.y === ty);
            const dx = Math.abs(tx - activeDrop.x); const dy = Math.abs(ty - activeDrop.y);
            
            if (dx > gridSize || dy > gridSize || (dx === 0 && dy === 0)) return;
            if (target && target.type === 'white') { activeDrop = { x: tx, y: ty, visualY: ty, state: 'floating' }; return; }
            if (target && target.type === 'black') return;

            pieces.push({ x: activeDrop.x, y: activeDrop.y, type: 'white', order: age });
            if (target && target.type === 'mystery') {
                pieces = pieces.filter(p => p !== target);
                score += (Math.random() > 0.4 ? 2 : -2);
                history.push({ age: age, desc: getLifeNarrative(age), isDeath: false });
            }

            activeDrop = { x: tx, y: ty, visualY: ty - 100, state: 'falling' };
            age++; timerEl.innerText = age;
            scoreEl.innerText = score;

            if (age % 10 === 0) {
                fateCenter = { x: Math.random()*canvas.width, y: Math.random()*canvas.height };
                generateOrbs();
            }
            if (age >= maxAge) finishGame();
        });

        function finishGame() {
            isEnded = true;
            history.push({ age: age, isDeath: true });
            overlay.classList.remove('hidden');
            renderChronicle();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(139, 91, 42, 0.05)";
            for(let i=0; i<canvas.width; i+=gridSize){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=gridSize){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            const whites = pieces.filter(p => p.type === 'white').sort((a,b) => a.order - b.order);
            if (whites.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = `rgba(139, 42, 42, ${lineAlpha})`; ctx.lineWidth = 4;
                ctx.moveTo(whites[0].x, whites[0].y);
                const limit = isEnded ? Math.floor(lineProgress * (whites.length - 1)) : whites.length - 1;
                for(let i=1; i<=limit; i++) ctx.lineTo(whites[i].x, whites[i].y);
                ctx.stroke();
                if(isEnded) {
                    if(lineProgress < 1) lineProgress += 0.015;
                    lineAlpha += alphaDir; if(lineAlpha < 0.2 || lineAlpha > 0.8) alphaDir *= -1;
                }
            }

            pieces.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI*2);
                if (p.type === 'white') { ctx.fillStyle = "#fff"; ctx.shadowBlur = 8; ctx.shadowColor = "#fff"; }
                else if (p.type === 'black') { ctx.fillStyle = "#2c2825"; }
                else if (p.type === 'mystery') { 
                    ctx.strokeStyle = "#8b572a"; ctx.strokeRect(p.x-10, p.y-10, 20, 20); 
                    ctx.fillStyle = "#8b572a"; ctx.font = "12px sans-serif"; ctx.fillText("?", p.x-4, p.y+4);
                }
                ctx.fill(); ctx.shadowBlur = 0;
            });

            if (activeDrop && !isEnded) {
                if (activeDrop.state === 'falling' && activeDrop.visualY < activeDrop.y) activeDrop.visualY += 12;
                ctx.beginPath(); ctx.arc(activeDrop.x, activeDrop.visualY, 18, 0, Math.PI*2);
                ctx.fillStyle = "#00b4d8"; ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { resize(); draw(); });
        init();
    </script>
</body>
</html>
